<mat-card class="ssp-card">
  <div class="opponent-select">
    <mat-button-toggle-group [(ngModel)]="opponentType" name="opponentType" class="opponent-toggle">
      <mat-button-toggle value="RANDOM" matTooltip="Play against random moves">
        <mat-icon>casino</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="IA" matTooltip="Play against AI">
        <mat-icon>smart_toy</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
 

  <h2>Stone, Paper, Scissors</h2>
  
    <div *ngIf="loading" class="loading-container">
      <mat-progress-spinner
        mode="indeterminate"
        diameter="50"
        color="primary">
      </mat-progress-spinner>
    </div>

  
    <div *ngIf="!playerMove && !loading" class="buttons">
      <button mat-raised-button color="primary" *ngFor="let option of options" (click)="play(option.name)">
        <mat-icon>{{ option.icon }}</mat-icon>
        {{ option.name }}
      </button>
    </div>
  
    <div *ngIf="playerMove && !loading" class="results">
      <p>Your choice: {{ playerMove }}</p>
      <p>Computer: {{ computerMove }}</p>
      <h3>{{ result }}</h3>
      <button mat-stroked-button color="accent" (click)="reset()"> <mat-icon>autorenew</mat-icon>Play Again</button>
    </div>
  </mat-card>
